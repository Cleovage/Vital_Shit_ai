<style>

            text-shadow: 0 0 10px rgba(176, 213, 0, 0.5), 0 0 20px rgba(176, 213, 0, 0.3);

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden" style="background-image: linear-gradient(to bottom, rgba(19,19,21,0.85), rgba(19,19,21,0.95)), url('https://lh3.googleusercontent.com/aida/ADBb0ugK3ej3zgLoo-W9oqRgkWI6qT3an0DUMMZ94Cwpuf9e5SbIgzPZOwuIGYxSq7TCzolw9pFQWfQu8ObTxI7HLdXhvP_CBBEb_3ufwIK_Y9NaijRFq5dL64SJuNOo5U0L2hD6vbbopoAqbueHUZGBVtziWhy-AjLcSPGNcQ051mrrduMe_deghX_3510RfCPJpa7Yq5rW5Zu4NPBSQ9bz1iBji1zfVFnJskrZcYwFtvyFXYlDNrMDQoMU134'); background-size: cover; background-position: center;">
<!-- Top Navigation (Task-focused/Destination check: Active training is task-focused, usually suppress nav, but we include TopAppBar per prompt for 'Live Training HUD for Apex Vitality') -->
<header class="w-full top-0 sticky border-b border-outline-variant bg-surface-container-lowest/80 backdrop-blur-md z-40">
<div class="flex justify-between items-center px-container-margin py-unit-4 w-full">
<div class="flex items-center gap-unit-2">
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 duration-100 p-2">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<div class="font-display-sm text-display-sm uppercase tracking-tighter text-primary">
                APEX VITALITY
            </div>
<div class="flex items-center gap-unit-2">
<div class="w-8 h-8 rounded-full bg-surface-container-high border border-outline-variant overflow-hidden flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" data-icon="person">person</span>
</div>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col justify-between p-container-margin relative z-10 w-full max-w-[1280px] mx-auto pt-8">
<!-- Status Bar -->
<div class="flex justify-between items-center mb-6">
<div class="bg-surface-container-high border border-outline-variant rounded px-3 py-1 flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-error animate-pulse"></span>
<span class="font-label-md text-label-md uppercase text-on-surface">Live Training</span>
</div>
<div class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">
                Zone 4: Threshold
            </div>
</div>
<!-- Primary HUD Area -->
<div class="flex-grow flex flex-col justify-center items-center gap-unit-8 mb-unit-8">
<!-- Central Biometric Display -->
<div class="relative w-72 h-72 flex items-center justify-center">
<!-- SVG Progress Ring -->
<svg class="absolute inset-0 w-full h-full drop-shadow-lg" height="288" viewbox="0 0 288 288" width="288">
<!-- Background Track -->
<circle cx="144" cy="144" fill="none" r="130" stroke="#2a2a2c" stroke-width="8"></circle>
<!-- Foreground Target Zone Indicator -->
<circle class="progress-ring__circle opacity-50" cx="144" cy="144" fill="none" r="130" stroke="#444932" stroke-dasharray="100 716" stroke-dashoffset="-500" stroke-width="12"></circle>
<!-- Active Progress -->
<circle class="progress-ring__circle" cx="144" cy="144" fill="none" r="130" stroke="#caf300" stroke-dasharray="816" stroke-dashoffset="150" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<div class="text-center z-10 flex flex-col items-center">
<span class="font-label-md text-label-md text-on-surface-variant uppercase mb-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" data-icon="favorite" data-weight="fill">favorite</span> Heart Rate
                    </span>
<div class="font-display-lg text-[96px] leading-[0.9] font-bold text-primary-container hud-text-glow tracking-tighter">
                        174
                    </div>
<span class="font-headline-md text-headline-md text-on-surface mt-1">BPM</span>
</div>
</div>
<!-- Secondary Metrics Row -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-unit-4 w-full">
<!-- Duration -->
<div class="bg-surface-container-high/60 backdrop-blur-sm border border-outline-variant p-4 rounded flex flex-col items-start justify-center h-28">
<span class="font-label-md text-label-md text-on-surface-variant uppercase mb-2">Duration</span>
<div class="font-headline-lg text-headline-lg text-primary tracking-tighter">42:15.8</div>
</div>
<!-- Power -->
<div class="bg-surface-container-high/60 backdrop-blur-sm border border-outline-variant p-4 rounded flex flex-col items-start justify-center h-28">
<span class="font-label-md text-label-md text-on-surface-variant uppercase mb-2">Power Output</span>
<div class="font-headline-lg text-headline-lg text-primary tracking-tighter flex items-end gap-1">
                        342 <span class="font-body-md text-on-surface-variant mb-1">W</span>
</div>
</div>
<!-- Strain -->
<div class="bg-surface-container-high/60 backdrop-blur-sm border border-outline-variant p-4 rounded flex flex-col items-start justify-center h-28">
<span class="font-label-md text-label-md text-on-surface-variant uppercase mb-2">Strain Score</span>
<div class="font-headline-lg text-headline-lg text-primary tracking-tighter">18.4</div>
</div>
<!-- Calories -->
<div class="bg-surface-container-high/60 backdrop-blur-sm border border-outline-variant p-4 rounded flex flex-col items-start justify-center h-28">
<span class="font-label-md text-label-md text-on-surface-variant uppercase mb-2">Energy</span>
<div class="font-headline-lg text-headline-lg text-primary tracking-tighter flex items-end gap-1">
                        640 <span class="font-body-md text-on-surface-variant mb-1">kcal</span>
</div>
</div>
</div>
</div>

<button class="bg-surface-container-high border border-outline-variant text-on-surface font-label-md text-label-md uppercase px-8 py-4 rounded hover:bg-surface-variant transition-colors active:scale-95 flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="flag">flag</span> Lap
            </button>
<button class="bg-error border border-error-container text-on-error font-label-md text-label-md uppercase px-10 py-4 rounded hover:opacity-90 transition-opacity active:scale-95 flex items-center gap-2 font-bold">
<span class="material-symbols-outlined" data-icon="stop">stop</span> End Workout
            </button>
</div>
